<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ArchonAI — agentic AWS architecture design." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>ArchonAI</title>
    <script>
      // Apply the saved (or system) theme before first paint so the page never
      // flashes the wrong theme. The storage key must match THEME_STORAGE_KEY in
      // src/stores/ui.store.ts, which owns theme changes after load.
      (function () {
        var theme = 'light';
        try {
          var stored = localStorage.getItem('archonai-theme');
          if (stored === 'light' || stored === 'dark') {
            theme = stored;
          } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
            theme = 'dark';
          }
        } catch (e) {}
        document.documentElement.classList.toggle('dark', theme === 'dark');
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
