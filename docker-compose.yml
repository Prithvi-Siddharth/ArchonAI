services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-archonai}
      MYSQL_USER: ${MYSQL_USER:-archon}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-archon}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-archon_root}
    ports:
      # Bound to 127.0.0.1 so the database is reachable only from this machine.
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      # Bound to 127.0.0.1 so Redis is reachable only from this machine.
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The FastAPI app. Built from the project Dockerfile.
  api:
    build: .
    image: archonai:latest
    restart: unless-stopped
    env_file:
      # GROQ_API_KEY / GROQ_MODEL (and any job settings) come from .env.
      - path: .env
        required: false
    environment: &service-addresses
      # Inside Docker, MySQL and Redis are reached by service name, not localhost.
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-archon}:${MYSQL_PASSWORD:-archon}@mysql:3306/${MYSQL_DATABASE:-archonai}
      REDIS_URL: redis://redis:6379/0
    volumes: &aws-profile
      # Local development only: lets CloudWatch logging use the AWS_PROFILE named
      # in .env (e.g. archonai-dev). Read-only; no credentials enter the image.
      - ${HOME}/.aws:/root/.aws:ro
    ports:
      - "127.0.0.1:8000:8000"
    depends_on: &needs-mysql-and-redis
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  # The Celery worker: same image, different start command.
  worker:
    image: archonai:latest
    restart: unless-stopped
    command: celery -A jobs.celery_app worker --loglevel=info --concurrency=${WORKER_CONCURRENCY:-1}
    env_file:
      - path: .env
        required: false
    environment: *service-addresses
    volumes: *aws-profile
    depends_on:
      <<: *needs-mysql-and-redis
      # Build the shared image (via the api service) before starting the worker.
      api:
        condition: service_started
    # The image's HEALTHCHECK probes the API's /health, which the worker doesn't serve.
    healthcheck:
      disable: true

volumes:
  mysql_data:
